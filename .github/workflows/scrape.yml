name: scrape-shinkansen-status

on:
  schedule:
    # GitHub Actions の cron は UTC。JST = UTC+9。
    # 06:00 / 09:00 / 12:00 / 15:00 / 18:00 / 21:00 JST に実行
    - cron: "0 21,0,3,6,9,12 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scraper/**"
      - ".github/workflows/scrape.yml"

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run scraper
        run: python scraper/scrape.py

      - name: Commit status.json if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "chore: update status.json ($(date -u +%FT%TZ))"
            git push
          fi
